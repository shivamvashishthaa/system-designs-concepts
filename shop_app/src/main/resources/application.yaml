spring:
  application:
    name: shop_app

  datasource:
    url: jdbc:postgresql://localhost:5432/minishop_db
    username: minishop_user
    password: minishop_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
