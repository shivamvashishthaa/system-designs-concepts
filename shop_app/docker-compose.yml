
services:

  postgres:
    image: postgres:17-alpine
    container_name: minishop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: minishop_db
      POSTGRES_USER: minishop_user
      POSTGRES_PASSWORD: minishop_pass

    ports:
      - "5432:5432"

    volumes:
      - minishop-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop_user -d minishop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minishop-postgres-data:
