services:

  postgres:
    image: postgres:17-alpine
    container_name: minishop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: minishop_db
      POSTGRES_USER: minishop_user
      POSTGRES_PASSWORD: minishop_pass

    ports:
      - "5432:5432"

    volumes:
      - minishop-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minishop_user -d minishop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: minishop-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@minishop.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    volumes:
      - minishop-pgadmin-data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minishop-postgres-data:
  minishop-pgadmin-data:
